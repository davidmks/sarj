version: 2

builds:
  - main: ./cmd/sarj
    binary: sarj
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"

homebrew_casks:
  - repository:
      owner: davidmks
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/davidmks/sarj
    description: Git worktree + tmux session manager
    license: MIT
    # The binaries are not notarized, so macOS would refuse to run them while
    # the download's quarantine flag is set. goreleaser's hooks still emit the
    # deprecated Ruby postflight block, so the declarative stanza goes here.
    # goreleaser runs this text as a Go template, so {{ "{{staged_path}}" }}
    # prints Homebrew's own {{staged_path}} token, which Homebrew fills in at
    # install time.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/sarj"]
        end
      end
